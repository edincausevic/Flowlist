<html lang="en">
<head>

<title>FlowList</title>
<script>try{var t=localStorage.getItem('flowlist.theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4fb;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e3e7f1;--inset:#eef0f8;--shadow:0 10px 30px rgba(30,40,90,.08);

:root[data-theme="dark"]{--bg:#0a0c16;--card:#131728;--text:#e9ebf7;--muted:#8a92b2;--line:#232942;--inset:#1a1f36;--shadow:0 10px 30px rgba(0,0,0,.4)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent,#6366f1);outline-offset:2px}
.wrap{max-width:none;margin:0;padding:24px clamp(16px,2.5vw,40px) 64px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.brand{font-weight:700;font-size:20px;letter-spacing:-.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}
.hero{container-type:inline-size;padding:28px 20px 22px;text-align:center;position:relative;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%),var(--card);transition:background .4s}
.now{font-size:14px;color:var(--muted);min-height:20px;display:flex;justify-content:center;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
.big{font-size:clamp(56px,9vw,110px);font-size:clamp(56px,26cqw,168px);font-weight:700;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums;margin:10px 0 14px;color:var(--text)}
.big.run{color:var(--accent)}
.bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden;max-width:420px;margin:0 auto 20px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s linear}
.ctl{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:14px;background:var(--inset);font-weight:600;font-size:14px;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(.96)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent,#6366f1);color:#fff;padding:13px 28px;font-size:15px}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{background:#ef4444;color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.icon{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:var(--muted);transition:background .15s,color .15s}
.icon:hover{background:var(--inset);color:var(--text)}
.icon.del:hover{color:#ef4444}
.add{display:flex;gap:8px;margin:0 0 14px;padding:10px;flex-wrap:wrap}
.add input{background:var(--inset);border:1px solid transparent;border-radius:12px;padding:12px 14px;min-width:0}
.add input:focus{outline:none;border-color:var(--accent,#6366f1)}
.add .t{flex:1 1 200px}.add .m{width:84px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:0 4px 10px}
.total{height:4px;border-radius:9px;background:var(--inset);margin:0 4px 14px;overflow:hidden}.total>i{display:block;height:100%;background:#22c55e;transition:width .3s}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.item{padding:12px 12px 12px 14px;border-left:5px solid var(--c);border-radius:18px;background:var(--card);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.item.act{outline:2px solid var(--c);outline-offset:-1px}
.item.done{opacity:.6}
.row{display:flex;align-items:center;gap:10px}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--c);display:grid;place-items:center;flex:none;color:#fff}
.done .chk{background:var(--c)}
.tt{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done .tt{text-decoration:line-through;color:var(--muted)}
.tt input{width:100%;background:var(--inset);border:1px solid var(--c);border-radius:8px;padding:6px 8px}
.tt input:focus{outline:none}
.time{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted);font-weight:600;min-width:52px;text-align:right}
.badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--inset);color:var(--muted);margin-left:8px}
.acts{display:flex;justify-content:flex-end;gap:2px;margin-top:6px;flex-wrap:wrap}
.sw{display:flex;gap:8px;justify-content:flex-end;padding:6px 4px 0}
.sw button{width:24px;height:24px;border-radius:50%;background:var(--c);border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--text)}
.grip{cursor:grab;color:var(--muted);display:grid;place-items:center;width:18px;flex:none;margin-left:-6px;touch-action:none}
.grip:active{cursor:grabbing}
.item.dragging{opacity:.4}
.item.over{box-shadow:0 -3px 0 0 var(--c),var(--shadow)}
.sel{background:var(--inset);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
.sel:focus-visible{outline:2px solid var(--accent,#6366f1)}
.mr{display:flex;align-items:center;gap:8px}
.board{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.25fr) minmax(0,1fr);gap:20px;align-items:start}
.col-timer{position:sticky;top:16px}
.colh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 2px 12px;min-height:34px}
.colh h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.cnt{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--inset);color:var(--muted)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.stats{margin-top:16px;padding:14px 16px 4px}
.stats .total{margin:0 0 14px}
.col-done .item{border-left-color:var(--c)}
.big.long{font-size:clamp(40px,6vw,76px);font-size:clamp(40px,17cqw,96px)}

.tools{position:relative;display:flex;gap:2px}
.icon.on{background:var(--inset);color:var(--text)}
.pop{position:absolute;right:0;top:calc(100% + 8px);width:min(320px,calc(100vw - 32px));padding:14px;z-index:8;animation:pop .12s ease-out}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.vol{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:14px}
.vol input{flex:1;min-width:0;accent-color:var(--accent,#6366f1);cursor:pointer}
.pv{font-size:12px;font-weight:600;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.pl{font-size:12px;color:var(--muted);font-weight:600;margin:0 2px 6px;text-transform:uppercase;letter-spacing:.06em}
.snd{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:10px;color:var(--text)}
.snd:hover,.snd.on{background:var(--inset)}
.rd{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none}
.snd.on .rd{border-color:var(--accent,#6366f1);background:radial-gradient(circle,var(--accent,#6366f1) 45%,transparent 50%)}
.sn{flex:1;display:flex;flex-direction:column;font-size:14px;font-weight:600}
.sn small{font-weight:400;color:var(--muted);font-size:12px}
.snd svg{color:var(--muted)}
.lk{margin:6px 0 0 44px;font-size:12px;min-width:0}
.lk a{display:inline-flex;align-items:center;gap:6px;color:var(--text);font-weight:600;text-decoration:none;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:4px 10px;border-radius:99px;background:var(--inset)}
.lk a:hover{text-decoration:underline}
.lk svg{color:var(--c);flex:none}
.empty{text-align:center;color:var(--muted);padding:40px 16px;border:2px dashed var(--line);border-radius:20px;font-size:14px}
.foot{display:flex;justify-content:center;margin-top:22px}
.ov{position:fixed;inset:0;background:rgba(5,8,20,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:9}
.modal{width:100%;max-width:400px;padding:24px;animation:pop .15s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.modal h3{margin:0 0 8px;font-size:18px}.modal p{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.5}
.modal label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.modal input{display:block;width:100%;margin-top:6px;background:var(--inset);border:1px solid transparent;border-radius:12px;padding:11px 12px}
.modal input:focus{outline:none;border-color:#6366f1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.hint{text-align:center;font-size:12px;color:var(--muted);margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function App(){

            h('option',{value:''},'Sort\u2026'),h('option',{value:'short'},'Shortest first'),h('option',{value:'long'},'Longest first'),h('option',{value:'az'},'Name A\u2013Z'),h('option',{value:'za'},'Name Z\u2013A'))),
